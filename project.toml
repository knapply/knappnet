# Single source of truth for the project's public name.
#
# The name appears in only a handful of places (R package metadata, the R
# init symbol, citation metadata, and docs). Every one of them is rewritten
# by `python3 tools/rename.py <new-name>`, and CI verifies that a rename to a
# throwaway name still builds and passes tests. Internal crate names, C
# symbols, and R function names never contain the project name.

[project]
name = "knappnet"
title = "Fast, Validated Network Analysis"
repository = "knapply/knappnet"
description = """
A network analysis engine with a dependency-free Rust core. Networks are \
represented as a pair of data frames (nodes and edges). Every metric is \
validated against established reference implementations."""
