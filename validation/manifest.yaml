# Metric manifest.
#
# Every measure the engine exposes is listed here with:
#   engine       - the engine call and arguments being validated
#   applies_to   - any | directed | undirected
#   tolerance    - rel/abs tolerance for floating-point comparison
#   oracles      - each reference implementation's equivalent call
#
# An oracle entry may declare `differs_when`, a list of fixture tags under
# which that oracle is known to follow a different convention, with the
# reason. On those fixtures a mismatch is reported as a documented
# convention difference rather than a failure. Any other mismatch fails CI.
#
# No measure ships without an entry here and at least one passing oracle.

degree_all:
  engine: {fn: degree, mode: all, loops: true}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "MultiGraph/MultiDiGraph G.degree()"
    igraph:
      call: "igraph::degree(g, mode = 'all', loops = TRUE)"
    sna:
      call: "sna::degree(m, gmode, cmode = 'freeman' | 'indegree' for graphs)"
      differs_when: [loops, multi_edges]
      reason: >-
        sna works on adjacency matrices, so parallel edges collapse to one,
        and it ignores the diagonal by default (diag = FALSE).

degree_all_noloops:
  engine: {fn: degree, mode: all, loops: false}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    igraph:
      call: "igraph::degree(g, mode = 'all', loops = FALSE)"
    sna:
      call: "sna::degree(m, gmode, diag = FALSE)"
      differs_when: [multi_edges]
      reason: sna works on adjacency matrices, so parallel edges collapse to one.

degree_out:
  engine: {fn: degree, mode: out, loops: true}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "MultiDiGraph G.out_degree()"
    igraph:
      call: "igraph::degree(g, mode = 'out', loops = TRUE)"
    sna:
      call: "sna::degree(m, cmode = 'outdegree')"
      differs_when: [loops, multi_edges]
      reason: sna collapses parallel edges and ignores the diagonal by default.

degree_in:
  engine: {fn: degree, mode: in, loops: true}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "MultiDiGraph G.in_degree()"
    igraph:
      call: "igraph::degree(g, mode = 'in', loops = TRUE)"
    sna:
      call: "sna::degree(m, cmode = 'indegree')"
      differs_when: [loops, multi_edges]
      reason: sna collapses parallel edges and ignores the diagonal by default.

strength_all:
  engine: {fn: strength, mode: all, loops: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    networkx:
      call: "G.degree(weight = 'weight')"
    igraph:
      call: "igraph::strength(g, mode = 'all', loops = TRUE)"

betweenness:
  engine: {fn: betweenness, weighted: false, normalized: false}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "nx.betweenness_centrality(G, normalized = False)"
      differs_when: [multi_edges]
      reason: >-
        NetworkX traverses neighbor sets, so parallel edges count as a single
        shortest path. igraph and this engine count each parallel edge as a
        distinct path.
    igraph:
      call: "igraph::betweenness(g, weights = NA, normalized = FALSE)"
    sna:
      call: "sna::betweenness(m, gmode, cmode = 'directed' | 'undirected')"
      differs_when: [multi_edges]
      reason: sna works on adjacency matrices, so parallel edges collapse to one.

betweenness_normalized:
  engine: {fn: betweenness, weighted: false, normalized: true}
  applies_to: any
  tolerance: {rel: 1.0e-9, abs: 1.0e-12}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "nx.betweenness_centrality(G, normalized = True)"
      differs_when: [multi_edges]
      reason: NetworkX counts parallel edges as a single shortest path.
    igraph:
      call: "igraph::betweenness(g, weights = NA, normalized = TRUE)"
      differs_when: [edge_case]
      reason: >-
        With fewer than three nodes the normalizing constant (n-1)(n-2) is
        zero. igraph returns NaN; this engine, like NetworkX, returns 0,
        since no node can lie between two others.

betweenness_weighted:
  engine: {fn: betweenness, weighted: true, normalized: false}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "nx.betweenness_centrality(G, weight = 'weight', normalized = False)"
    igraph:
      call: "igraph::betweenness(g, weights = E(g)$weight, normalized = FALSE)"

betweenness_weighted_strength:
  engine: {fn: betweenness, weighted: true, normalized: false, weights_as: strength}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "direct evaluation with exact lengths 1/w"
    networkx:
      call: "nx.betweenness_centrality(G, weight = 1/w, normalized = False)"
      differs_when: [integer_weights]
      reason: >-
        Reciprocals of whole-number weights often give path lengths that tie
        exactly (1/3 + 1/6 = 1/2) but differ in the last bit of floating
        point. NetworkX compares lengths exactly and drops one of the tied
        paths; this engine (like igraph) compares with a relative tolerance
        and agrees with the exact-arithmetic definition oracle.
    igraph:
      call: "igraph::betweenness(g, weights = 1 / E(g)$weight, normalized = FALSE)"

triad_census:
  engine: {fn: triad_census}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "direct evaluation of the definition (validation/oracles/definition_oracle.py)"
    networkx:
      call: "nx.triadic_census(DiGraph(G))"
      differs_when: [undirected]
      reason: NetworkX defines the triad census only for directed graphs.
    igraph:
      call: "igraph::triad_census(g)"
      differs_when: [multi_edges]
      reason: >-
        igraph's triad census does not support multigraphs: parallel edges
        change its counts. This engine, sna, and the definition oracle
        classify each dyad as tied or not, so parallel edges count once.
    sna:
      call: "sna::triad.census(m, mode = 'digraph')"
      differs_when: [undirected, edge_case]
      reason: >-
        sna returns NaN for networks with fewer than three nodes, which have
        no triads; this engine returns zero counts. For undirected graphs sna
        reports only the four undirected triad
        classes, while igraph and this engine report all 16 types with every
        edge treated as mutual.
