# Graph isomorphism, induced subgraph isomorphism, and monomorphism
# (VF2++; Juttner and Madarasi 2018), the quick isomorphism checks, and tree
# isomorphism (Aho, Hopcroft, and Ullman 1974), as NetworkX 3.7 defines
# them. Format: see ../README.md; runners, derived inputs, and encodings
# in ../bindings/isomorphism.py.
#
# Every oracle reads a fixture as a NetworkX Graph or DiGraph, or a
# MultiGraph or MultiDiGraph when it has parallel edges (VF2++ then
# matches edge multiplicities). Counts of mappings are capped at 5000;
# the engine's iterator and its count must agree, and its first mapping
# must be valid. The order in which mappings come is not compared
# (NetworkX's depends on Python set order).

vf2pp_iso:
  engine: {fn: vf2pp, problem: iso}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "isomorphisms between the fixture and rev(fixture): every injective node map checked against the definition, edge multiplicities included (isomorphism_definition_oracle.py)"
      undefined_on: [davis_twomode, florentine, gnp_dir_dense, gnp_dir_sparse, gnp_und_dense,
        gnp_und_sparse, karate, kite, les_miserables, multi_loops_dir, multi_loops_und,
        path10, real_weights_dir, real_weights_und, southern_women, twomode_random,
        twomode_weighted, uniform_weights, weighted_dir, weighted_und]
      undefined_reason: the definition oracle tries every permutation, so it runs on networks of at most 8 nodes
    networkx:
      call: "min(len(list(nx.vf2pp_all_isomorphisms(G, rev(G)))), 5000)"

vf2pp_iso_labels:
  engine: {fn: vf2pp, problem: iso, labels: true}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "label-preserving isomorphisms between the fixture and rev(fixture): every injective node map checked against the definition, edge multiplicities included (isomorphism_definition_oracle.py)"
      undefined_on: [davis_twomode, florentine, gnp_dir_dense, gnp_dir_sparse, gnp_und_dense,
        gnp_und_sparse, karate, kite, les_miserables, multi_loops_dir, multi_loops_und,
        path10, real_weights_dir, real_weights_und, southern_women, twomode_random,
        twomode_weighted, uniform_weights, weighted_dir, weighted_und]
      undefined_reason: the definition oracle tries every permutation, so it runs on networks of at most 8 nodes
    networkx:
      call: "min(len(list(nx.vf2pp_all_isomorphisms(G, rev(G), node_label = 'label'))), 5000)"

