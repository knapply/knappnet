could_be_iso_d_rev:
  engine: {fn: could_be_iso, properties: d, against: rev}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sorted per-node tuples of degree, compared cumulatively, against rev(fixture)"
    networkx:
      call: "nx.could_be_isomorphic(G, rev(G), properties = 'd')"

could_be_iso_d_perturbed:
  engine: {fn: could_be_iso, properties: d, against: perturbed}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sorted per-node tuples of degree, compared cumulatively, against perturbed(fixture)"
    networkx:
      call: "nx.could_be_isomorphic(G, perturbed(G), properties = 'd')"

could_be_iso_dt_rev:
  engine: {fn: could_be_iso, properties: dt, against: rev}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sorted per-node tuples of degree, triangles, compared cumulatively, against rev(fixture)"
      undefined_when: [directed]
      undefined_reason: NetworkX counts triangles and maximal cliques of undirected graphs only (it raises NetworkXNotImplemented)
    networkx:
      call: "nx.could_be_isomorphic(G, rev(G), properties = 'dt')"
      undefined_when: [directed]
      undefined_reason: NetworkX counts triangles and maximal cliques of undirected graphs only (it raises NetworkXNotImplemented)

