  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sorted per-node tuples of degree, triangles, compared cumulatively, against perturbed(fixture)"
      undefined_when: [directed]
      undefined_reason: NetworkX counts triangles and maximal cliques of undirected graphs only (it raises NetworkXNotImplemented)
    networkx:
      call: "nx.could_be_isomorphic(G, perturbed(G), properties = 'dt')"
