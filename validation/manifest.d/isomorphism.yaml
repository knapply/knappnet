tree_iso:
  engine: {fn: tree_iso}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "trees isomorphic by brute force over permutations (at most 8 nodes) or by comparing AHU canonical strings of every rooting; mapping validity checked edge by edge"
    networkx:
      call: "isomorphism.tree_isomorphism(T1, T2), (T1, T3), isomorphism.rooted_tree_isomorphism(T1, 0, T2, k - 1), (T1, 0, T2, k - 2); (non-empty, valid) each"
