# Shortest paths: parents, predecessor lists, bidirectional and A* search,
# negative lengths (Bellman-Ford, Goldberg-Radzik, Johnson, Floyd-Warshall),
# counts and lists of shortest paths, and k shortest simple paths. Format:
# see ../README.md; engine runners in ../bindings/paths.py, which also
# documents the options and the edge lengths (`lengths`).
#
# Every runner checks each returned path (each step is an arc, the path
# length equals the reported distance) before reducing it to numbers.
# Distances can be negative here, so an unreachable node is written as
# -1e9 and a negative cycle as -2e9 by the runner and every oracle.
# Predecessor lists and sets of paths are compared as `sets` of groups
# encoded so that sorting within a group keeps their meaning: node v's
# predecessor u as v (n + 1) + u (an empty list as v (n + 1) + n), and the
# i-th node of a path as i n + node.
#
# Oracles: `definition` is paths_definition_oracle.py (exact rational
# arithmetic: Bellman-Ford rounds over every arc, the recurrence for path
# counts, exhaustive enumeration of simple paths on small networks);
# `networkx` is paths_networkx_oracle.py.

paths_sssp_unweighted:
  engine: {fn: paths_sssp}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact arithmetic, from every source"
    networkx:
      call: "nx.single_source_shortest_path_length(G, s) for every s"

paths_sssp_unweighted_in:
  engine: {fn: paths_sssp, mode: in}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "as paths_sssp_unweighted on the reversed arcs"
    networkx:
      call: "nx.single_target_shortest_path_length(G, s) for every s"

paths_sssp_unweighted_all:
  engine: {fn: paths_sssp, mode: all}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "as paths_sssp_unweighted ignoring arc directions"
    networkx:
      call: "nx.single_source_shortest_path_length(G.to_undirected(), s) for every s"

paths_sssp_weighted:
  engine: {fn: paths_sssp, lengths: weights, via_weights: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact rational arithmetic"
    networkx:
      call: "nx.single_source_dijkstra_path_length(G, s, weight = 'weight') for every s"

paths_sssp_strength:
  engine: {fn: paths_sssp, lengths: strength, via_weights: true}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "as paths_sssp_weighted with lengths 1/w"
    networkx:
      call: "nx.single_source_dijkstra_path_length(G, s, weight = lambda u, v, d: min(1 / w)) for every s"

paths_sssp_cutoff_unweighted:
  engine: {fn: paths_sssp, cutoff: 2}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "distances at most 2, the rest unreachable"
    networkx:
      call: "nx.single_source_shortest_path_length(G, s, cutoff = 2) for every s"

paths_sssp_cutoff_weighted:
  engine: {fn: paths_sssp, lengths: weights, cutoff: 2.5}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "distances at most 2.5, the rest unreachable"
    networkx:
      call: "nx.single_source_dijkstra_path_length(G, s, cutoff = 2.5, weight = 'weight') for every s"

paths_multi_source_unweighted:
  engine: {fn: paths_multi_source}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "the smaller of the exact distances from node 0 and node n - 1"
    networkx:
      call: "nx.multi_source_dijkstra_path_length(G, {0, n - 1}, weight = None)"

paths_multi_source_weighted:
  engine: {fn: paths_multi_source, lengths: weights}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "the smaller of the exact distances from node 0 and node n - 1"
    networkx:
      call: "nx.multi_source_dijkstra_path_length(G, {0, n - 1}, weight = 'weight')"

paths_predecessors_unweighted:
  engine: {fn: paths_predecessors}
  applies_to: any
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "u precedes v when d(0, u) + 1 = d(0, v) and u -> v is an arc (exact distances)"
    networkx:
      call: "nx.predecessor(G, 0)"

paths_predecessors_weighted:
  engine: {fn: paths_predecessors, lengths: weights, tie: exact}
  applies_to: any
  requires_weights: true
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "u precedes v when d(0, u) + len(u, v) = d(0, v) exactly (rational arithmetic)"
    networkx:
      call: "nx.dijkstra_predecessor_and_distance(G, 0, weight = 'weight')[0]"

paths_all_pairs_unweighted:
  engine: {fn: paths_all_pairs}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "exact distances from every source"
    networkx:
      call: "dict(nx.all_pairs_shortest_path_length(G))"

paths_all_pairs_weighted:
  engine: {fn: paths_all_pairs, lengths: weights}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source"
    networkx:
      call: "dict(nx.all_pairs_dijkstra_path_length(G, weight = 'weight'))"

paths_bidirectional_unweighted:
  engine: {fn: paths_bidirectional}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "exact distance of every pair"
    networkx:
      call: "len(nx.bidirectional_shortest_path(G, s, t)) - 1 for every pair (no path: unreachable)"

paths_bidirectional_weighted:
  engine: {fn: paths_bidirectional, lengths: weights}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distance of every pair"
    networkx:
      call: "nx.bidirectional_dijkstra(G, s, t, weight = 'weight')[0] for every pair"

paths_astar_half:
  engine: {fn: paths_astar, lengths: weights, factor: 0.5}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distance of every pair"
    networkx:
      call: "nx.astar_path_length(G, s, t, heuristic = lambda u, v: 0.5 d(u, t), weight = 'weight') for every pair"

paths_astar_exact:
  engine: {fn: paths_astar, factor: 1.0}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "exact distance of every pair"
    networkx:
      call: "nx.astar_path_length(G, s, t, heuristic = lambda u, v: d(u, t)) for every pair"

paths_bellman_ford_potential:
  engine: {fn: paths_negative, lengths: potential, method: bellman_ford}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact arithmetic (lengths w + p(u) - p(v))"
    networkx:
      call: "nx.single_source_bellman_ford_path_length(G, 0, weight = 'len')"

paths_goldberg_radzik_potential:
  engine: {fn: paths_negative, lengths: potential, method: goldberg_radzik}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact arithmetic (lengths w + p(u) - p(v))"
    networkx:
      call: "nx.goldberg_radzik(G, 0, weight = 'len')[1]"

paths_bellman_ford_shift:
  engine: {fn: paths_negative, lengths: shift, method: bellman_ford}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact arithmetic; a change in round n is a negative cycle"
    networkx:
      call: "nx.single_source_bellman_ford_path_length(G, 0, weight = 'len'); NetworkXUnbounded is a negative cycle"

paths_goldberg_radzik_shift:
  engine: {fn: paths_negative, lengths: shift, method: goldberg_radzik}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "rounds of relaxing every arc in exact arithmetic; a change in round n is a negative cycle"
    networkx:
      call: "nx.goldberg_radzik(G, 0, weight = 'len')[1]; NetworkXUnbounded is a negative cycle"

paths_negative_cycle_shift:
  engine: {fn: paths_negative_cycle, lengths: shift}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "relaxation rounds from every node at distance 0; a change in round n is a negative cycle"
    networkx:
      call: "nx.negative_edge_cycle(G, weight = 'len')"

paths_negative_cycle_potential:
  engine: {fn: paths_negative_cycle, lengths: potential}
  applies_to: directed
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "relaxation rounds from every node at distance 0 (never a cycle: lengths are reweighted)"
    networkx:
      call: "nx.negative_edge_cycle(G, weight = 'len')"

paths_johnson_potential:
  engine: {fn: paths_johnson, lengths: potential}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source (lengths w + p(u) - p(v))"
    networkx:
      call: "nx.johnson(G, weight = 'len'), each path's length summed in order"

paths_johnson_shift:
  engine: {fn: paths_johnson, lengths: shift}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source, or a negative cycle anywhere"
    networkx:
      call: "nx.johnson(G, weight = 'len'); NetworkXUnbounded is a negative cycle"

paths_floyd_warshall_weighted:
  engine: {fn: paths_floyd_warshall, lengths: weights}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source"
    networkx:
      call: "nx.floyd_warshall(G, weight = 'weight')"

paths_floyd_warshall_shift:
  engine: {fn: paths_floyd_warshall, lengths: shift}
  applies_to: any
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source, or a negative cycle anywhere"
    networkx:
      call: "nx.floyd_warshall(G, weight = 'len'); NetworkXUnbounded is a negative cycle"

paths_floyd_warshall_potential:
  engine: {fn: paths_floyd_warshall, lengths: potential}
  applies_to: directed
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "exact distances from every source (lengths w + p(u) - p(v))"
    networkx:
      call: "nx.floyd_warshall(G, weight = 'len')"

paths_count_unweighted:
  engine: {fn: paths_count}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sigma(v) = sum of sigma(u) over predecessors u, from exact distances"
    networkx:
      call: "len(list(nx.all_shortest_paths(G, 0, t))) for every t (0 without a path)"

paths_count_weighted:
  engine: {fn: paths_count, lengths: weights, tie: exact}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "sigma(v) = sum of sigma(u) over predecessors u, from exact rational distances"
    networkx:
      call: "len(list(nx.all_shortest_paths(G, 0, t, weight = 'weight'))) for every t"

paths_all_shortest_unweighted:
  engine: {fn: paths_all_shortest}
  applies_to: any
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "every path from 0 to n - 1 along predecessor arcs of the exact distances"
    networkx:
      call: "list(nx.all_shortest_paths(G, 0, n - 1)) (none on NetworkXNoPath)"

paths_all_shortest_weighted:
  engine: {fn: paths_all_shortest, lengths: weights, tie: exact}
  applies_to: any
  requires_weights: true
  compare: sets
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "every path from 0 to n - 1 along predecessor arcs of the exact rational distances"
    networkx:
      call: "list(nx.all_shortest_paths(G, 0, n - 1, weight = 'weight'))"

paths_k_shortest_unweighted:
  engine: {fn: paths_k_shortest, k: 10}
  applies_to: any
  tolerance: {rel: 0, abs: 0}
  oracles:
    definition:
      call: "lengths of the 10 shortest of all simple paths from 0 to n - 1, by exhaustive enumeration (networks with at most 10 nodes)"
      undefined_on: [davis_twomode, florentine, gnp_dir_dense, gnp_dir_sparse, gnp_und_dense, gnp_und_sparse, karate, les_miserables, multi_loops_dir, multi_loops_und, real_weights_dir, real_weights_und, southern_women, twomode_random, twomode_weighted, uniform_weights, weighted_dir, weighted_und]
      undefined_reason: >-
        Exhaustive enumeration of simple paths is limited to networks with
        at most 10 nodes; larger ones have too many simple paths.
    networkx:
      call: "lengths of the first 10 paths of nx.shortest_simple_paths(H, 0, n - 1), H the simple graph"

paths_k_shortest_weighted:
  engine: {fn: paths_k_shortest, lengths: weights, k: 10}
  applies_to: any
  requires_weights: true
  tolerance: {rel: 1.0e-12, abs: 1.0e-12}
  oracles:
    definition:
      call: "lengths of the 10 shortest simple paths by exhaustive enumeration (networks with at most 10 nodes)"
      undefined_on: [davis_twomode, florentine, gnp_dir_dense, gnp_dir_sparse, gnp_und_dense, gnp_und_sparse, karate, les_miserables, multi_loops_dir, multi_loops_und, real_weights_dir, real_weights_und, southern_women, twomode_random, twomode_weighted, uniform_weights, weighted_dir, weighted_und]
      undefined_reason: >-
        Exhaustive enumeration of simple paths is limited to networks with
        at most 10 nodes; larger ones have too many simple paths.
    networkx:
      call: "nx.path_weight of the first 10 paths of nx.shortest_simple_paths(H, 0, n - 1, weight = 'weight'), H the simple graph keeping the lightest parallel edge"
