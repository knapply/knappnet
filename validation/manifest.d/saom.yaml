    rsiena:
      call: "RSiena: includeEffects(eff, outPopSqrt); siena07(nsub = 0, cond = FALSE)$targets2"
      differs_when: [directed]
      reason: >-
        The engine follows the formula in the RSiena manual, s_i = sum_j x_ij
        sqrt(x_j+), on the network at the end of each period. The target
        statistics RSiena 1.6.6 reports for outPopSqrt instead equal sum_ij
        x_ij(t_m+1) x_j+(t_m): the alters' out-degrees at the start of the
        period, without the square root (found by comparing RSiena's targets
        on small networks; the other degree effects agree with the manual)

