  oracles:
    definition:
      call: "s_i(x with i->j) - s_i(x without i->j) for simX with the constant covariate"

saom_targets_simX_changing:
  engine: {fn: saom_targets, effect: simX, covariate: changing}
  applies_to: directed
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "sum_i s_i(x(t_m+1)) for simX with the changing covariate, centered as RSiena centers it"
    rsiena:
      call: "RSiena: includeEffects(eff, simX, interaction1 = 'changing'); siena07(nsub = 0, cond = FALSE)$targets2"
      differs_when: [directed]
      reason: >-
        The engine centers the similarity of a changing covariate by its mean
        over ordered pairs of distinct actors and periods, as for a constant
        covariate (where it agrees with RSiena). RSiena computes the
        similarity mean of changing covariates differently; its definition
        is not given in the manual, and on small examples it is not the mean
        over pairs and periods

