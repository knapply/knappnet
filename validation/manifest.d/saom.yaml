# Stochastic actor-oriented models: the deterministic parts of the model,
# checked on every directed fixture turned into a three-wave panel by
# validation/saom_fixtures.py (wave 1 is the fixture read as an adjacency
# matrix; waves 2 and 3 toggle fixed sets of tie variables; four covariates
# are derived from the actor indices). Format as in ../manifest.yaml.
#
# Engine runners are in validation/bindings/saom.py. The definition oracle
# (validation/oracles/saom_definition_oracle.py) evaluates each effect's
# statistic from its formula in chapter 13 of the RSiena manual with plain
# loops, and change statistics as the difference of the statistics of the
# networks with and without the tie (for GWESP, the weight of the tie, as
# RSiena defines these elementary effects). The RSiena oracle
# (validation/oracles/r_saom.R) reports the target statistics RSiena itself
# uses in unconditional estimation (siena07(..., nsub = 0)$targets2), so a
# match means the engine's statistics, covariate centering, and
# similarity means are RSiena's exactly.
#
# Estimates are stochastic and are compared with RSiena in the R package's
# tests (r/tests/testthat/test-saom.R), within tolerances set by the
# standard errors both report.
#
# Engine options:
#   fn          saom_targets | saom_contributions | saom_distances
#   effect      RSiena short name of the effect
#   covariate   constant | changing | binary | dyadic (covariate effects)
#   parameter   internal effect parameter (GWESP: 100 alpha; default 69)
#
# saom_targets returns one value per period (two); saom_contributions the
# change statistics Delta_kij for the first 12 actors i (fewer on smaller
# fixtures) and every alter j on wave 1 with the covariates of period 1,
# actor-major (0 for j = i);
# saom_distances the number of changed tie variables per period, the
# target statistic of the rate parameters.

saom_distances:
  engine: {fn: saom_distances}
  applies_to: directed
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "number of (i, j) with x_ij(t_m) != x_ij(t_m+1), per period"
    rsiena:
      call: "RSiena: siena07(nsub = 0, cond = FALSE)$targets2, rate rows"

saom_targets_density:
  engine: {fn: saom_targets, effect: density}
  applies_to: directed
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "sum_i s_i(x(t_m+1)) for density from its formula"
    rsiena:
      call: "RSiena: includeEffects(eff, density); siena07(nsub = 0, cond = FALSE)$targets2"

saom_contributions_density:
  engine: {fn: saom_contributions, effect: density}
  applies_to: directed
  tolerance: {rel: 1.0e-9, abs: 1.0e-9}
  oracles:
    definition:
      call: "s_i(x with i->j) - s_i(x without i->j) for density"

