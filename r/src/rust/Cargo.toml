[workspace]
resolver = "2"
members = ["crates/engine", "crates/capi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
publish = false
repository = "https://github.com/knapply/knappnet"
homepage = "https://github.com/knapply/knappnet"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
