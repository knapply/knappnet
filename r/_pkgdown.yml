url: https://knapply.github.io/knappnet/

# The home page is the repository README, copied to pkgdown/index.md by
# pkgdown/home.R before the site is built (see .github/workflows/pkgdown.yml).

template:
  bootstrap: 5
  # Render the formulas in help pages (\eqn, \deqn) and articles ($...$)
  # with MathJax; pkgdown's default (MathML) displays LaTeX poorly.
  math-rendering: mathjax
  bslib:
    primary: "#24577a"
    link-color: "#24577a"
    body-color: "#22262a"
    border-radius: "0.3rem"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

home:
  title: "knappnet: fast, validated network analysis"
  description: >-
    Network analysis on two data frames, with a compiled, multithreaded
    engine validated against igraph, sna, and NetworkX, and one argument to
    reproduce the conventions of igraph, NetworkX, sna, or UCINET.

navbar:
  structure:
    left: [intro, reference, switching, concepts]
    right: [search, github]
  components:
    switching:
      text: Coming from
      menu:
      - text: igraph
        href: articles/coming-from-igraph.html
      - text: statnet, sna, and network
        href: articles/coming-from-statnet.html
      - text: UCINET, ORA, Pajek, and Gephi
        href: articles/coming-from-ucinet-ora-pajek-gephi.html
      - text: NetworkX
        href: articles/coming-from-networkx.html
    concepts:
      text: Concepts
      menu:
      - text: What knappnet means by a network
        href: articles/definitions.html
      - text: Conventions across tools
        href: articles/conventions.html
      - text: Plotting networks and results
        href: articles/plotting.html
      - text: Spatial networks with sf
        href: articles/spatial-networks.html
      - text: How results are validated
        href: articles/validation.html
      - text: Performance
        href: articles/performance.html
    github:
      icon: fa-github
      href: https://github.com/knapply/knappnet
      aria-label: Source code on GitHub

articles:
- title: Get started
  navbar: ~
  contents:
  - knappnet
- title: Coming from another tool
  desc: >-
    Function-by-function maps for analysts who already know another
    package or program, with worked examples that compare results.
  contents:
  - articles/coming-from-igraph
  - articles/coming-from-statnet
  - articles/coming-from-ucinet-ora-pajek-gephi
  - articles/coming-from-networkx
- title: Concepts
  desc: >-
    What the package means by a network, how it makes its choices, how to
    look at results, spatial networks, and how results are checked.
  contents:
  - articles/definitions
  - articles/conventions
  - articles/plotting
  - articles/spatial-networks
  - articles/validation
  - articles/performance

# Every help topic must appear below (tools/check_r_docs.py checks this;
# pkgdown stops if one is missing). Sections follow the order in which a
# reader meets the package: build a network, describe it, measure nodes
# and groups, then the specialised network types and plots.
reference:
- title: Networks
  desc: >-
    A network is a pair of data frames, one row per node and one row per
    edge, with any attributes as columns. Build one from data frames,
    convert one from another package, read one from a file, or load an
    example.
  contents:
  - netframe
  - summary.netframe
  - as_netframe
  - read_network
  - example_network

- title: Working with network data
  desc: >-
    Combining relations, dichotomizing and symmetrizing ties, subsets of
    nodes, and node attributes, as in UCINET's Transform and Data menus.
  contents:
  - combine_relations
  - dichotomize
  - symmetrize
  - subnetwork
  - recode_attribute

- title: Conventions
  desc: >-
    How igraph, NetworkX, sna, and UCINET differ, and the `convention`
    argument that reproduces each.
  contents:
  - conventions

- title: Centrality
  desc: >-
    Node-level measures. Each returns a vector aligned with the rows of the
    node table.
  contents:
  - degree
  - betweenness
  - closeness
  - eigenvector_centrality
  - pagerank
  - katz_centrality
  - power_centrality
  - hub_score
  - reach
  - proximity_prestige
  - edge_betweenness
  - information_centrality
  - bridging_centrality

- title: The network as a whole
  desc: >-
    Density, components, reciprocity, transitivity, distances, cut
    structure, centralization, the triad census, compactness, small worlds,
    and core-periphery structure.
  contents:
  - graph_density
  - average_degree
  - components
  - reciprocity
  - transitivity
  - distances
  - reachability
  - cut_points
  - centralization
  - centralize
  - triad_census
  - compactness
  - small_world
  - core_periphery

- title: Cohesion and subgroups
  desc: >-
    Cores, cliques and their relaxations, bicomponents, lambda sets,
    modularity, community detection, factions, and hierarchical clustering.
  contents:
  - coreness
  - max_cliques
  - n_cliques
  - bicomponents
  - lambda_sets
  - modularity
  - cluster_louvain
  - cluster_girvan_newman
  - factions
  - cluster_hierarchical

- title: Positions and brokerage
  desc: >-
    Structural holes, brokerage roles, equivalence, and blockmodels.
  contents:
  - constraint
  - brokerage
  - structural_equivalence
  - concor
  - regular_equivalence
  - automorphic_equivalence
  - blockmodel

- title: Mixing and homophily
  desc: >-
    Whether ties form within or across groups defined by node attributes.
  contents:
  - mixing_matrix
  - ei_index
  - assortativity
  - homophily

- title: Ego networks
  desc: >-
    Each node's neighborhood as a network of its own, and egocentric
    measures computed for every node at once.
  contents:
  - ego_network
  - ego_summary

- title: Two-mode networks
  desc: >-
    People-by-event and people-by-organization data: construction,
    projections, and two-mode centrality.
  contents:
  - twomode
  - project
  - twomode_degree

- title: Key players and group centrality
  desc: >-
    Which nodes, removed or targeted together, most fragment or reach a
    network, and centrality for groups of nodes.
  contents:
  - key_players
  - group_centrality
  - flow_betweenness

- title: Statistical tests and random networks
  desc: >-
    Permutation and conditional uniform graph tests that respect the
    dependence among ties sharing a node, and random network models.
  contents:
  - qap_cor
  - mrqap
  - cug_test
  - random_gnp

- title: Temporal networks
  desc: >-
    Time-stamped contacts: snapshots and windows, time-respecting paths and
    reachability, temporal closeness, measures over time, and burstiness.
  contents:
  - temporal_network
  - network_at
  - snapshots
  - aggregate_network
  - temporal_distances
  - temporal_reach
  - temporal_closeness
  - rolling
  - burstiness
  - plot_timeline
  - plot_rolling

- title: Geospatial networks
  desc: >-
    Networks whose nodes have locations: great-circle or planar distances,
    proximity networks, the spatial spread of groups, and sf geometries.
  contents:
  - spatial_network
  - proximity_network
  - to_sf
  - from_lines
  - to_sfnetwork
  - plot_spatial

- title: Scaling
  desc: >-
    Multidimensional scaling of distances and dissimilarities, as in
    UCINET's MDS tools.
  contents:
  - classical_mds
  - mds_distances

- title: Layouts and plotting
  desc: >-
    Layouts computed in the engine, a default plot that needs no arguments,
    and plots of measures, matrices, distributions, and test results.
  contents:
  - plot.netframe
  - layout_network
  - plot_centrality
  - plot_partition
  - plot_coreness
  - plot_ego
  - plot_scores
  - plot_matrix
  - plot_mixing_matrix
  - plot_degree_distribution
  - plot_component_sizes
  - plot_triad_census
  - plot_robustness
  - plot.blockmodel
  - plot.classical_mds
  - plot.qap_cor
  - plot.mrqap
