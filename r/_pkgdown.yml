url: https://knapply.github.io/knappnet/

# The home page is the repository README, copied to pkgdown/index.md by
# pkgdown/home.R before the site is built (see .github/workflows/pkgdown.yml).

template:
  bootstrap: 5
  # Render the formulas in help pages (\eqn, \deqn) and articles ($...$)
  # with MathJax; pkgdown's default (MathML) displays LaTeX poorly.
  math-rendering: mathjax
  bslib:
    primary: "#24577a"
    link-color: "#24577a"
    body-color: "#22262a"
    border-radius: "0.3rem"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

home:
  title: "knappnet: fast, validated network analysis"
  description: >-
    Network analysis on two data frames, with a compiled, multithreaded
    engine validated against igraph, sna, and NetworkX, and one argument to
    reproduce the conventions of igraph, NetworkX, sna, or UCINET.

navbar:
  structure:
    left: [intro, reference, switching, concepts]
    right: [search, github]
  components:
    switching:
      text: Coming from
      menu:
      - text: igraph
        href: articles/coming-from-igraph.html
      - text: statnet, sna, and network
        href: articles/coming-from-statnet.html
      - text: UCINET, ORA, Pajek, and Gephi
        href: articles/coming-from-ucinet-ora-pajek-gephi.html
      - text: NetworkX
        href: articles/coming-from-networkx.html
    concepts:
      text: Concepts
      menu:
      - text: Conventions across tools
        href: articles/conventions.html
      - text: Exponential random graph models
        href: articles/ergm.html
      - text: Stochastic actor-oriented models
        href: articles/saom.html
      - text: Plotting
        href: articles/plotting.html
      - text: Spatial networks with sf
        href: articles/spatial-networks.html
      - text: How results are validated
        href: articles/validation.html
      - text: Performance
        href: articles/performance.html
    github:
      icon: fa-github
      href: https://github.com/knapply/knappnet
      aria-label: Source code on GitHub

articles:
- title: Get started
  navbar: ~
  contents:
  - knappnet
- title: Coming from another tool
  desc: >-
    Function-by-function maps for analysts who already know another
    package or program, with worked examples that compare results.
  contents:
  - articles/coming-from-igraph
  - articles/coming-from-statnet
  - articles/coming-from-ucinet-ora-pajek-gephi
  - articles/coming-from-networkx
- title: Concepts
  contents:
  - articles/conventions
  - articles/validation
  - articles/performance
  - articles/spatial-networks
  - articles/plotting
  - articles/ergm
  - articles/saom

# Every help topic must appear below; pkgdown stops if one is missing.
reference:
- title: Networks
  desc: >-
    A network is a pair of data frames, one row per node and one row per
    edge, with any attributes as columns.
  contents:
  - netframe

- title: Describing a network
  desc: >-
    Network summaries and descriptive statistics: reciprocity,
    transitivity, distances, and cut structure.
  contents:
  - summary.netframe
  - reciprocity
  - transitivity
  - distances
  - reachability
  - cut_points

- title: Working with network data
  desc: >-
    Combining relations, dichotomizing and symmetrizing ties, subsets of
    nodes, and node attributes, as in UCINET's Transform and Data menus.
  contents:
  - combine_relations
  - dichotomize
  - symmetrize
  - subnetwork
  - recode_attribute

- title: Example data
  desc: >-
    Classic and dark networks for teaching and for reproducing published
    analyses, including the Noordin Top network.
  contents:
  - example_network

- title: Conversion and files
  desc: >-
    Convert to and from igraph, tidygraph, network (statnet), and adjacency
    matrices, and read and write the file formats of other tools.
  contents:
  - as_netframe
  - read_network

- title: Centrality
  desc: >-
    Node-level measures. Each returns a vector aligned with the rows of the
    node table.
  contents:
  - degree
  - betweenness
  - closeness
  - eigenvector_centrality
  - pagerank
  - katz_centrality
  - power_centrality
  - hub_score
  - reach
  - proximity_prestige
  - edge_betweenness
  - information_centrality
  - bridging_centrality
  - centralize

- title: Cohesion and subgroups
  contents:
  - components
  - coreness
  - max_cliques
  - modularity
  - cluster_louvain
  - bicomponents
  - n_cliques
  - lambda_sets
  - factions
  - cluster_girvan_newman
  - cluster_hierarchical

- title: Mixing and homophily
  desc: >-
    Whether ties form within or across groups defined by node attributes.
  contents:
  - mixing_matrix
  - ei_index
  - assortativity
  - homophily

- title: Key players and group centrality
  desc: >-
    Which nodes, removed or targeted together, most fragment or reach a
    network, and centrality for groups of nodes.
  contents:
  - key_players
  - group_centrality
  - flow_betweenness

- title: Brokerage and positions
  contents:
  - constraint
  - brokerage
  - structural_equivalence
  - concor
  - regular_equivalence
  - automorphic_equivalence
  - blockmodel

- title: Scaling
  desc: >-
    Multidimensional scaling of distances and dissimilarities, as in
    UCINET's MDS tools.
  contents:
  - classical_mds
  - mds_distances

- title: Geospatial networks
  desc: >-
    Networks whose nodes have locations: great-circle or planar distances,
    proximity networks, and the spatial spread of groups.
  contents:
  - spatial_network
  - proximity_network
  - to_sf
  - from_lines
  - to_sfnetwork
  - plot_spatial

- title: Ego networks
  desc: >-
    Each node's neighborhood as a network of its own, and egocentric
    measures computed for every node at once.
  contents:
  - ego_network
  - ego_summary

- title: Two-mode networks
  desc: >-
    People-by-event and people-by-organization data: construction,
    projections, and two-mode centrality.
  contents:
  - twomode
  - project
  - twomode_degree

- title: Topography
  desc: Measures of the network as a whole.
  contents:
  - graph_density
  - centralization
  - triad_census
  - core_periphery
  - small_world
  - compactness
  - average_degree

- title: Exponential random graph models
  desc: >-
    ERGMs estimated by maximum pseudolikelihood, Monte Carlo maximum
    likelihood, or exact enumeration for small networks, with simulation,
    goodness of fit, MCMC diagnostics, and pooled temporal ERGMs.
  contents:
  - ergm_fit
  - simulate.ergm_fit
  - predict.ergm_fit
  - ergm_gof
  - mcmc_diagnostics
  - tergm_fit

- title: Stochastic actor-oriented models
  desc: >-
    Network panel data: effects, method of moments estimation by
    stochastic approximation, simulation, and goodness of fit.
  contents:
  - saom_data
  - saom_effects
  - saom_control
  - saom_fit
  - plot.saom_fit
  - saom_simulate
  - saom_gof

- title: Statistical tests
  desc: >-
    Permutation tests for dyadic data that respect the dependence among
    ties sharing a node.
  contents:
  - qap_cor
  - mrqap
  - cug_test
  - random_gnp

- title: Layouts and plotting
  desc: >-
    Layouts computed in the engine, a default plot that needs no arguments,
    and plots of measures, matrices, distributions, and test results.
  contents:
  - plot.netframe
  - layout_network
  - plot_centrality
  - plot_partition
  - plot_coreness
  - plot_ego
  - plot_scores
  - plot_matrix
  - plot_mixing_matrix
  - plot_degree_distribution
  - plot_component_sizes
  - plot_triad_census
  - plot_robustness
  - plot.blockmodel
  - plot.classical_mds
  - plot.qap_cor
  - plot.mrqap

- title: Temporal networks
  desc: >-
    Time-stamped contacts: snapshots and windows, time-respecting paths and
    reachability, temporal closeness, measures over time, and burstiness.
  contents:
  - temporal_network
  - network_at
  - snapshots
  - aggregate_network
  - temporal_distances
  - temporal_reach
  - temporal_closeness
  - rolling
  - plot_timeline
  - plot_rolling
  - burstiness

- title: Conventions
  desc: >-
    How igraph, NetworkX, sna, and UCINET differ, and the `convention`
    argument that reproduces each.
  contents:
  - conventions
