# Full benchmarks against igraph, sna, NetworkX, python-igraph, and
# NetworKit. Run on demand and weekly; results appear as annotations on the
# run and as CSV artifacts. The quick versions run in ci.yml on every change.
name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install tools
        run: |
          python -m pip install networkx numpy scipy igraph pyyaml
          # NetworKit has no wheel for every platform; its comparisons are
          # skipped where it does not install.
          python -m pip install networkit || echo "NetworKit is not available here."
          Rscript -e 'install.packages(c("igraph", "sna"), repos = "https://cloud.r-project.org")'
          R CMD INSTALL r
          cargo build --release -p capi
      - name: R benchmarks
        run: |
          set -o pipefail
          mkdir -p ci-logs
          Rscript bench/bench.R 2>&1 | tee ci-logs/r.log
      - name: Python benchmarks
        if: always()
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python bench/bench.py 2>&1 | tee ci-logs/python.log
      - name: Show results
        if: always()
        run: LEVEL=notice bash tools/ci_annotate.sh Benchmarks ci-logs/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench/results
