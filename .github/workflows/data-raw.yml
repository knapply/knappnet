# Rebuilds the bundled example data from its published sources (see
# data-raw/) and pushes the result to the `data-raw-output` branch for
# review. Run on demand only.
name: Rebuild example data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install igraph
        run: Rscript -e 'install.packages("igraph", repos = "https://cloud.r-project.org")'
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/schochastics/networkdata /tmp/networkdata
          git clone --depth 1 https://github.com/cran/manet /tmp/manet
      - name: Build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          Rscript data-raw/noordin.R /tmp/networkdata /tmp/manet 2>&1 | tee ci-logs/noordin.log
      - name: Show log
        if: always()
        run: LEVEL=notice bash tools/ci_annotate.sh "Example data" ci-logs/*.log
      - name: Push to data-raw-output
        run: |
          git config user.name "knapply"
          git config user.email "knapply@users.noreply.github.com"
          git checkout -b data-raw-output
          git add r/inst/extdata
          git commit -m "Rebuild example data"
          git push -f origin data-raw-output
