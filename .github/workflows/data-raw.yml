# Rebuilds the bundled example data from its published sources (see
# data-raw/) and pushes the result to the `data-raw-output` branch for
# review. Runs on demand only; about 5 minutes.
name: Rebuild example data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install igraph
        run: Rscript -e 'install.packages("igraph", repos = "https://cloud.r-project.org")'
      - name: Install networkx
        run: python3 -m pip install --user networkx
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/schochastics/networkdata /tmp/networkdata
          git clone --depth 1 https://github.com/cran/manet /tmp/manet
          git clone --depth 1 https://github.com/schochastics/signnet /tmp/signnet
          git clone --depth 1 https://github.com/ascherer/sgb /tmp/sgb
          git clone --depth 1 --filter=blob:none --sparse https://github.com/nvkelso/natural-earth-vector /tmp/natural-earth-vector
          git -C /tmp/natural-earth-vector sparse-checkout set geojson
          git clone --depth 1 https://github.com/knapply/homophily /tmp/homophily
      - name: Build
        run: |
          bash tools/ci_log.sh noordin Rscript data-raw/noordin.R /tmp/networkdata /tmp/manet
          bash tools/ci_log.sh examples python3 data-raw/examples.py /tmp/homophily
          bash tools/ci_log.sh ucinet python3 data-raw/ucinet.py /tmp/networkdata /tmp/signnet
          bash tools/ci_log.sh graphbase python3 data-raw/graphbase.py /tmp/sgb
          bash tools/ci_log.sh natural_earth python3 data-raw/natural_earth.py /tmp/natural-earth-vector
          bash tools/ci_log.sh sociopatterns python3 data-raw/sociopatterns.py /tmp/sociopatterns
      - name: Build data sets awaiting redistribution permission (not committed)
        run: bash tools/ci_log.sh knecht python3 data-raw/knecht.py /tmp/knecht && rm -r r/inst/extdata/knecht
      - name: Show log
        if: always()
        run: LEVEL=notice bash tools/ci_annotate.sh "Example data" ci-logs/*.log
      - name: Push to data-raw-output
        run: |
          git config user.name "knapply"
          git config user.email "knapply@users.noreply.github.com"
          git checkout -b data-raw-output
          git add r/inst/extdata
          git commit -m "Rebuild example data"
          git push -f origin data-raw-output
