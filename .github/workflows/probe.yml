# Runs probe/probe.R with the packages in probe/packages.txt and shows its
# output as annotations. Lives only on the `probe` branch.
name: Probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: |
          Rscript -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
          Rscript -e 'pak::pkg_install(readLines("probe/packages.txt"))'
      - name: Probe
        run: Rscript probe/probe.R > probe.log 2>&1 || true
      - name: Show output
        if: always()
        run: |
          split -l 60 probe.log part_
          k=1
          for f in part_*; do
            body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::notice title=probe (part $k)::${body}"
            k=$((k + 1))
          done
