# The full test suite runs on Linux, macOS, and Windows for every push and
# pull request: engine tests, validation against every oracle, and
# R CMD check. Older and development versions of R are covered on demand by
# r-check.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p knappnet --no-deps
      - name: Crate packages for crates.io
        run: cargo package -p knappnet
      - name: Builds for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p knappnet --target wasm32-unknown-unknown --release

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: cargo test --workspace
      - name: C ABI
        # The smoke test links with the system C compiler; on Windows the
        # same ABI is exercised by the validation job and by R CMD check.
        if: runner.os != 'Windows'
        run: ./tools/check_c_abi.sh
      - name: R sources in sync
        run: python tools/sync_r_sources.py --check
      - name: Rename still works
        run: python tools/rename.py --self-test

  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install oracles
        run: |
          python -m pip install networkx pyyaml
          Rscript -e 'install.packages(c("igraph", "sna", "yaml"), repos = "https://cloud.r-project.org")'
      - name: Fixtures are reproducible
        run: |
          python validation/fixtures.py
          git diff --exit-code validation/fixtures
      - name: Regenerate golden values
        run: python validation/run_oracles.py
      - name: Compare
        run: python validation/compare.py --strict
      - name: File formats against NetworkX
        run: python -W ignore validation/io_check.py
      - name: QAP against exact permutation distributions
        run: python validation/qap_check.py
      - name: Upload report and golden values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            validation/REPORT.md
            validation/golden

  r-package:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        # R on Windows links with the GNU toolchain from Rtools.
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  readme:
    # The README's examples show real output; this fails if they drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the package and igraph
        run: |
          Rscript -e 'install.packages("igraph", repos = "https://cloud.r-project.org")'
          R CMD INSTALL r
      - name: README output matches R
        run: Rscript tools/check_readme.R
