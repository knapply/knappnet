# The full test suite, on every push to main and every pull request:
#
#   lint         format, clippy, docs, crate packaging, WebAssembly build,
#                bibliography, manifest, scaffold, R docs, R sources in sync
#   engine       cargo test and the C ABI smoke test on Linux, macOS, Windows
#   python       the NetworkX backend: build, its tests against NetworkX, and
#                part of NetworkX's own test suite run through the backend
#   validation   every oracle regenerated and compared with the engine on
#                Linux, macOS, Windows, plus the checks outside the manifest
#   r-package    R CMD check --as-cran on current R everywhere and, on Linux,
#                on R-devel, the previous release, and the minimum (4.1)
#   sanitizers   the C glue under AddressSanitizer and UBSan
#   valgrind     examples and tests under valgrind
#   readme       the README's printed output matches R; quick benchmarks
#                agree with igraph and sna
#
# Other platforms run on demand in r-check.yml; full benchmarks and the
# validation at scale in bench.yml. Typical durations are noted on each job
# (with warm caches; the first run after a dependency change is longer).
# Logs of failed steps are shown as annotations by tools/ci_annotate.sh;
# tools/ci_log.sh keeps the copy it reads.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    # About 5 minutes.
    name: lint and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p knappnet --no-deps
      - name: Crate packages for crates.io
        run: cargo package -p knappnet
      - name: Builds for WebAssembly
        run: cargo build -p knappnet --target wasm32-unknown-unknown --release
      - name: Bibliography is well-formed and docs/references.md is current
        run: python tools/check_bib.py
      - name: No R function defined twice
        run: python tools/check_r_functions.py
      - name: R help pages, NAMESPACE, and pkgdown index are consistent
        run: python tools/check_r_docs.py
      - name: R sources in sync
        run: python tools/sync_r_sources.py --check
      - name: Validation manifest is well-formed
        run: |
          python -m pip install pyyaml
          python validation/check_manifest.py
      - name: Measure scaffold runs
        run: python tools/new_measure.py probe probe_measure --dry-run

  engine:
    # About 5 minutes per platform.
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: C ABI
        # The smoke test links with the system C compiler; on Windows the
        # same ABI is exercised by the validation job and by R CMD check.
        if: runner.os != 'Windows'
        run: ./tools/check_c_abi.sh
      - name: Data model C ABI
        if: runner.os != 'Windows'
        run: ./tools/check_frame_abi.sh

  python:
    # About 6 minutes per platform. The package is built from source (Cargo
    # compiles the C ABI, setuptools the extension) and checked against
    # NetworkX: python/tests compares every implemented function with
    # NetworkX, then a subset of NetworkX's own tests runs through the
    # backend (python/docs/testing.md; the full suite runs on btower). The
    # oldest supported Python and NetworkX are tested on Linux.
    name: python (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.10", networkx: "networkx==3.5"}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install
        run: |
          python -m pip install ${{ matrix.networkx || 'networkx' }} pytest numpy scipy
          bash tools/ci_log.sh build python -m pip install -v ./python
      - name: Backend against NetworkX
        run: bash tools/ci_log.sh tests python -m pytest python/tests -q
      - name: NetworkX's tests through the backend (subset)
        env:
          NETWORKX_TEST_BACKEND: knappnet
          NETWORKX_FALLBACK_TO_NX: "True"
        run: >-
          bash tools/ci_log.sh nxsuite python -m pytest -q -p no:cacheprovider
          --pyargs networkx.algorithms.centrality networkx.algorithms.components
          networkx.algorithms.shortest_paths networkx.algorithms.assortativity
          networkx.algorithms.link_analysis networkx.algorithms.community
          networkx.algorithms.tests.test_cluster networkx.algorithms.tests.test_core
          networkx.algorithms.tests.test_triads networkx.algorithms.tests.test_bridges
          networkx.algorithms.tests.test_distance_measures
          networkx.algorithms.tests.test_efficiency
          networkx.algorithms.tests.test_structuralholes
          networkx.algorithms.tests.test_reciprocity networkx.algorithms.tests.test_wiener
          networkx.algorithms.tests.test_clique networkx.algorithms.bipartite
      - name: Show failures
        if: failure()
        run: bash tools/ci_annotate.sh python ci-logs/*.log

  validation:
    # About 15 minutes per platform with cached R packages (the cache is
    # keyed on the package list below; a change to it rebuilds the cache,
    # which takes 20 to 40 minutes).
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # pak installs homophily from GitHub; unauthenticated requests are
      # rate-limited.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Install Python oracles
        run: python -m pip install -r validation/requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        # The R oracles (validation/oracles/r_*.R). Installed through pak
        # and cached between runs; homophily comes from GitHub.
        with:
          packages: |
            any::igraph
            any::sna
            any::yaml
            any::network
            any::Matrix
            any::keyplayer
            any::tsna
            knapply/homophily
      - name: Fixtures are reproducible
        run: |
          python validation/fixtures.py
          git diff --exit-code validation/fixtures
      - name: Regenerate golden values
        run: bash tools/ci_log.sh oracles python validation/run_oracles.py
      - name: Compare
        run: bash tools/ci_log.sh compare python validation/compare.py --strict
      - name: File formats against NetworkX
        run: bash tools/ci_log.sh io python -W ignore validation/io_check.py
      - name: QAP against exact permutation distributions
        run: bash tools/ci_log.sh qap python validation/qap_check.py
      - name: Random networks and CUG tests
        run: bash tools/ci_log.sh cug python validation/cug_check.py
      - name: Layout properties
        run: bash tools/ci_log.sh layout python validation/layout_check.py
      - name: Benchmarks agree with NetworkX (small networks)
        run: bash tools/ci_log.sh bench python bench/bench.py --quick
      - name: Show failures
        if: failure()
        run: bash tools/ci_annotate.sh validation ci-logs/*.log
      - name: Upload report and golden values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            validation/REPORT.md
            validation/golden

  r-package:
    # About 15 minutes per entry with cached R packages. The engine is
    # compiled by R CMD build and is not cached.
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          # The minimum version in DESCRIPTION. Suggested packages are not
          # installed (some no longer support R 4.1; the tests skip without
          # them), and without knitr the vignette cannot be built.
          - {os: ubuntu-latest, r: "4.1", dependencies: '"hard"',
             build-args: 'c("--no-manual", "--no-build-vignettes")',
             check-args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        # R on Windows links with the GNU toolchain from Rtools.
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: ${{ matrix.dependencies || '"all"' }}
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          build_args: ${{ matrix.build-args || 'c("--no-manual")' }}
          args: ${{ matrix.check-args || 'c("--no-manual", "--as-cran")' }}
          # On Linux a known warning about compiled code is expected (see
          # tools/ci_check_warnings.sh), so only errors stop the check
          # there and the next step rejects every other warning.
          error-on: ${{ runner.os == 'Linux' && '"error"' || '"warning"' }}
      - name: No other warnings
        if: runner.os == 'Linux'
        run: bash tools/ci_check_warnings.sh r/check/*.Rcheck/00check.log
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "R CMD check (R ${{ matrix.r }})" \
            r/check/*.Rcheck/00install.out r/check/*.Rcheck/00check.log \
            r/check/*.Rcheck/tests/*.Rout.fail r/check/*.Rcheck/*-Ex.Rout

  sanitizers:
    # About 45 minutes. The C glue under AddressSanitizer and
    # UndefinedBehaviorSanitizer, with R-devel built by gcc with both
    # (RDsan in the wch1/r-debug image), as in CRAN's additional checks.
    # The Rust engine is linked but not instrumented. Fails on any
    # sanitizer report in the installation log, the examples, or the tests.
    name: R CMD check under ASan and UBSan
    runs-on: ubuntu-latest
    container: wch1/r-debug:latest
    timeout-minutes: 90
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      # R does not free everything at exit, so leak reports are only noise.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for the Rust installer
        run: command -v curl || { apt-get update && apt-get install -y curl ca-certificates; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install testthat
        run: >-
          RDsan -q -e 'if (!requireNamespace("testthat", quietly = TRUE))
          install.packages("testthat", repos = "https://cloud.r-project.org")'
      - name: Build
        run: RDsan CMD build --no-build-vignettes --no-manual r
      - name: Check
        run: bash tools/ci_log.sh check RDsan CMD check --no-manual --ignore-vignettes ./*.tar.gz
      - name: No sanitizer reports
        if: always()
        run: |
          files=$(ls ./*.Rcheck/00install.out ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout* 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No check output found"; exit 1; fi
          if grep -nE 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (Address|UndefinedBehavior)Sanitizer' $files; then
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "Sanitizers" ci-logs/check.log ./*.Rcheck/00install.out \
            ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout*

  valgrind:
    # About 60 to 90 minutes. Examples and tests under valgrind, with
    # R-devel built with valgrind instrumentation level 2 (RDvalgrind in the
    # wch1/r-debug image), as in CRAN's additional checks. Fails on any
    # reported memory error.
    name: R CMD check under valgrind
    runs-on: ubuntu-latest
    container: wch1/r-debug:latest
    timeout-minutes: 120
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      VALGRIND_OPTS: --track-origins=yes --leak-check=no
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for the Rust installer
        run: command -v curl || { apt-get update && apt-get install -y curl ca-certificates; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install valgrind and testthat
        run: |
          command -v valgrind || { apt-get update && apt-get install -y valgrind; }
          RDvalgrind -q -e 'if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat", repos = "https://cloud.r-project.org")'
      - name: Build
        run: RDvalgrind CMD build --no-build-vignettes --no-manual r
      - name: Check
        run: bash tools/ci_log.sh check RDvalgrind CMD check --use-valgrind --no-manual --ignore-vignettes ./*.tar.gz
      - name: No valgrind errors
        if: always()
        run: |
          files=$(ls ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout* 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No check output found"; exit 1; fi
          grep -n 'ERROR SUMMARY' $files || { echo "valgrind did not run"; exit 1; }
          if grep -nE 'ERROR SUMMARY: [1-9]|Invalid (read|write|free)|uninitialised|Conditional jump' $files; then
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "valgrind" ci-logs/check.log ./*.Rcheck/*-Ex.Rout \
            ./*.Rcheck/tests/*.Rout*

  readme:
    # About 10 minutes with cached R packages. The README's examples show
    # real output; this fails if they drift. The quick benchmarks also
    # check that results agree with igraph and sna.
    name: README output and quick R benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r/src/rust -> target
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: '"hard"'
          extra-packages: any::igraph, any::sna
      - name: Install the package
        run: bash tools/ci_log.sh install R CMD INSTALL r
      - name: README output matches R
        run: bash tools/ci_log.sh readme Rscript tools/check_readme.R
      - name: Benchmarks agree with igraph and sna (small networks)
        run: bash tools/ci_log.sh bench Rscript bench/bench.R --quick
      - name: Show failures
        if: failure()
        run: bash tools/ci_annotate.sh README ci-logs/*.log
