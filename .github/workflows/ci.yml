# The full test suite runs on Linux, macOS, and Windows for every push and
# pull request: engine tests, validation against every oracle, and
# R CMD check --as-cran on current R everywhere and, on Linux, on R-devel,
# the previous release, and the minimum supported version (4.1). The C glue
# is also checked under AddressSanitizer, UndefinedBehaviorSanitizer, and
# valgrind. Other platforms are covered on demand by r-check.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: No R function defined twice
        run: python3 tools/check_r_functions.py
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs build without warnings
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p knappnet --no-deps
      - name: Crate packages for crates.io
        run: cargo package -p knappnet
      - name: Builds for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p knappnet --target wasm32-unknown-unknown --release

  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: cargo test --workspace
      - name: C ABI
        # The smoke test links with the system C compiler; on Windows the
        # same ABI is exercised by the validation job and by R CMD check.
        if: runner.os != 'Windows'
        run: ./tools/check_c_abi.sh
      - name: R sources in sync
        run: python tools/sync_r_sources.py --check
      - name: Rename still works
        run: python tools/rename.py --self-test

  validation:
    name: validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install oracles
        env:
          # remotes uses the GitHub API to install homophily; unauthenticated
          # requests are rate-limited.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install networkx numpy scipy pyyaml
          Rscript -e 'install.packages(c("igraph", "keyplayer", "sna", "tsna", "yaml"), repos = "https://cloud.r-project.org")'
          Rscript -e 'install.packages(c("remotes", "network", "Matrix"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("knapply/homophily", upgrade = "never")'
      - name: Fixtures are reproducible
        run: |
          python validation/fixtures.py
          git diff --exit-code validation/fixtures
      - name: Regenerate golden values
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python validation/run_oracles.py 2>&1 | tee ci-logs/oracles.log
      - name: Compare
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python validation/compare.py --strict 2>&1 | tee ci-logs/compare.log
      - name: File formats against NetworkX
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python -W ignore validation/io_check.py 2>&1 | tee ci-logs/io.log
      - name: QAP against exact permutation distributions
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python validation/qap_check.py 2>&1 | tee ci-logs/qap.log
      - name: Layout properties
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python validation/layout_check.py 2>&1 | tee ci-logs/layout.log
      - name: Benchmarks agree with NetworkX (small networks)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          python bench/bench.py --quick 2>&1 | tee ci-logs/bench.log
      - name: Show failures
        if: failure()
        run: bash tools/ci_annotate.sh validation ci-logs/*.log
      - name: Upload report and golden values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            validation/REPORT.md
            validation/golden

  r-package:
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          # The minimum version in DESCRIPTION. Suggested packages are not
          # installed: some no longer support R 4.1, and the tests skip
          # without them.
          # Without knitr the vignette cannot be built, so it is skipped.
          - {os: ubuntu-latest, r: "4.1", dependencies: '"hard"',
             build-args: 'c("--no-manual", "--no-build-vignettes")',
             check-args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        # R on Windows links with the GNU toolchain from Rtools.
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: ${{ matrix.dependencies || '"all"' }}
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          build_args: ${{ matrix.build-args || 'c("--no-manual")' }}
          args: ${{ matrix.check-args || 'c("--no-manual", "--as-cran")' }}
          # On Linux the statically linked Rust standard library contains
          # references to abort() and exit(), which R CMD check reports as a
          # warning; the engine never calls them (see r/cran-comments.md).
          # There, warnings are checked by the next step instead.
          error-on: ${{ runner.os == 'Linux' && '"error"' || '"warning"' }}
      - name: No other warnings
        if: runner.os == 'Linux'
        run: |
          log=$(ls r/check/*.Rcheck/00check.log)
          other=$(grep -E '\.\.\. (\[[^]]*\] )?WARNING$' "$log" | grep -v 'checking compiled code' || true)
          if [ -n "$other" ]; then
            echo "$other"
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "R CMD check (R ${{ matrix.r }})" \
            r/check/*.Rcheck/00install.out r/check/*.Rcheck/00check.log \
            r/check/*.Rcheck/tests/*.Rout.fail

  sanitizers:
    # The C glue under AddressSanitizer and UndefinedBehaviorSanitizer, with
    # R-devel built by gcc with both (RDsan in the wch1/r-debug image), as in
    # CRAN's additional checks. The Rust engine is linked but not
    # instrumented. Fails on any sanitizer report in the installation log,
    # the examples, or the tests.
    name: R CMD check under ASan and UBSan
    runs-on: ubuntu-latest
    container: wch1/r-debug:latest
    timeout-minutes: 90
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      # R does not free everything at exit, so leak reports are only noise.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for the Rust installer
        run: command -v curl || { apt-get update && apt-get install -y curl ca-certificates; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install testthat
        run: >-
          RDsan -q -e 'if (!requireNamespace("testthat", quietly = TRUE))
          install.packages("testthat", repos = "https://cloud.r-project.org")'
      - name: Build
        run: RDsan CMD build --no-build-vignettes --no-manual r
      - name: Check
        run: |
          set -o pipefail
          mkdir -p ci-logs
          RDsan CMD check --no-manual --ignore-vignettes ./*.tar.gz 2>&1 | tee ci-logs/check.log
      - name: No sanitizer reports
        if: always()
        run: |
          files=$(ls ./*.Rcheck/00install.out ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout* 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No check output found"; exit 1; fi
          if grep -nE 'runtime error:|ERROR: AddressSanitizer|SUMMARY: (Address|UndefinedBehavior)Sanitizer' $files; then
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "Sanitizers" ci-logs/check.log ./*.Rcheck/00install.out \
            ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout*

  valgrind:
    # Examples and tests under valgrind, with R-devel built with valgrind
    # instrumentation level 2 (RDvalgrind in the wch1/r-debug image), as in
    # CRAN's additional checks. Fails on any reported memory error.
    name: R CMD check under valgrind
    runs-on: ubuntu-latest
    container: wch1/r-debug:latest
    timeout-minutes: 120
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      VALGRIND_OPTS: --track-origins=yes --leak-check=no
    steps:
      - uses: actions/checkout@v4
      - name: Install curl for the Rust installer
        run: command -v curl || { apt-get update && apt-get install -y curl ca-certificates; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install valgrind and testthat
        run: |
          command -v valgrind || { apt-get update && apt-get install -y valgrind; }
          RDvalgrind -q -e 'if (!requireNamespace("testthat", quietly = TRUE)) install.packages("testthat", repos = "https://cloud.r-project.org")'
      - name: Build
        run: RDvalgrind CMD build --no-build-vignettes --no-manual r
      - name: Check
        run: |
          set -o pipefail
          mkdir -p ci-logs
          RDvalgrind CMD check --use-valgrind --no-manual --ignore-vignettes ./*.tar.gz 2>&1 \
            | tee ci-logs/check.log
      - name: No valgrind errors
        if: always()
        run: |
          files=$(ls ./*.Rcheck/*-Ex.Rout ./*.Rcheck/tests/*.Rout* 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No check output found"; exit 1; fi
          grep -n 'ERROR SUMMARY' $files || { echo "valgrind did not run"; exit 1; }
          if grep -nE 'ERROR SUMMARY: [1-9]|Invalid (read|write|free)|uninitialised|Conditional jump' $files; then
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "valgrind" ci-logs/check.log ./*.Rcheck/*-Ex.Rout \
            ./*.Rcheck/tests/*.Rout*

  readme:
    # The README's examples show real output; this fails if they drift.
    # Quick benchmarks also check that results agree with igraph and sna.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install the package, igraph, and sna
        run: |
          set -o pipefail
          mkdir -p ci-logs
          Rscript -e 'install.packages(c("igraph", "sna"), repos = "https://cloud.r-project.org")'
          R CMD INSTALL r 2>&1 | tee ci-logs/install.log
      - name: README output matches R
        run: |
          set -o pipefail
          mkdir -p ci-logs
          Rscript tools/check_readme.R 2>&1 | tee ci-logs/readme.log
      - name: Benchmarks agree with igraph and sna (small networks)
        run: |
          set -o pipefail
          Rscript bench/bench.R --quick 2>&1 | tee ci-logs/bench.log
      - name: Show failures
        if: failure()
        run: bash tools/ci_annotate.sh README ci-logs/*.log
