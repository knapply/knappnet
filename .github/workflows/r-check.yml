# R CMD check on platforms that ci.yml does not cover on every push: older
# and development R on macOS and Windows, and Linux on ARM.
# Current R everywhere, and R-devel, oldrel-1, and 4.1 on Linux, run in
# ci.yml. This workflow runs on demand and for release tags (see
# docs/RELEASING.md).
name: R CMD check (extra platforms)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, r: devel}
          - {os: macos-latest, r: oldrel-1}
          - {os: windows-latest, r: devel}
          - {os: windows-latest, r: oldrel-1}
          - {os: ubuntu-24.04-arm, r: release}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          # See ci.yml: on Linux the Rust standard library's references to
          # abort() and exit() give a known warning, so only errors fail
          # there and other warnings are checked by the next step.
          error-on: ${{ runner.os == 'Linux' && '"error"' || '"warning"' }}
      - name: No other warnings
        if: runner.os == 'Linux'
        run: |
          log=$(ls r/check/*.Rcheck/00check.log)
          other=$(grep -E '\.\.\. (\[[^]]*\] )?WARNING$' "$log" | grep -v 'checking compiled code' || true)
          if [ -n "$other" ]; then
            echo "$other"
            exit 1
          fi
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "R CMD check (${{ matrix.os }}, R ${{ matrix.r }})" \
            r/check/*.Rcheck/00install.out r/check/*.Rcheck/00check.log \
            r/check/*.Rcheck/tests/*.Rout.fail
