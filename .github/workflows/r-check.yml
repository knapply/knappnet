# R CMD check --as-cran on the platforms ci.yml does not cover on every
# push: R-devel and the previous release on macOS and Windows, and Linux
# on ARM. Runs on demand and for release tags (see docs/RELEASING.md).
# About 15 minutes per entry with cached R packages.
name: R CMD check (extra platforms)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  check:
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, r: devel}
          - {os: macos-latest, r: oldrel-1}
          - {os: windows-latest, r: devel}
          - {os: windows-latest, r: oldrel-1}
          - {os: ubuntu-24.04-arm, r: release}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        # R on Windows links with the GNU toolchain from Rtools.
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          # As in ci.yml: on Linux a known warning about compiled code is
          # expected (tools/ci_check_warnings.sh), so only errors stop the
          # check there and the next step rejects every other warning.
          error-on: ${{ runner.os == 'Linux' && '"error"' || '"warning"' }}
      - name: No other warnings
        if: runner.os == 'Linux'
        run: bash tools/ci_check_warnings.sh r/check/*.Rcheck/00check.log
      - name: Show failures
        if: failure()
        run: |
          bash tools/ci_annotate.sh "R CMD check (${{ matrix.os }}, R ${{ matrix.r }})" \
            r/check/*.Rcheck/00install.out r/check/*.Rcheck/00check.log \
            r/check/*.Rcheck/tests/*.Rout.fail r/check/*.Rcheck/*-Ex.Rout
