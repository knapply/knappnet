# R CMD check against older and development versions of R. Current R on
# Linux, macOS, and Windows is covered on every push by ci.yml; this runs on
# demand and for release tags.
name: R CMD check (other R versions)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: "4.1"}
          - {os: macos-latest, r: oldrel-1}
          - {os: windows-latest, r: devel}
          - {os: windows-latest, r: oldrel-1}
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
