# Publishes the engine crate to crates.io when a release tag is pushed.
# Requires a repository secret CARGO_REGISTRY_TOKEN (crates.io API token).
# About 5 minutes.
name: Publish crate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Publish
        run: cargo publish -p knappnet
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
